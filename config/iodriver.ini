; ==============================================================================
; Pin Configuration Overview
; default: Whether to use default pin configuration (global rule)
;   - not set / 1: Enable default configuration
;   - 0: Disable default configuration, use custom pins
;   note: Default pins are defined in hwDrivecfg.def of the base package. hwDrivecfg.def uses chip pins, need to convert to module pins according to IO multiplexing table.
;   pin:  Module pin
;   func: Pin multiplexing function
; ==============================================================================

[uart]
; ------------------------------------------------------------------------------
; UART Pin Configuration
; Format:
;   uart*_default = en          ; Enable default pins for this UART (en=enable, dis=disable)
;   uart*_pin_tx  = pin,func  ; TX pin: function number
;   uart*_pin_rx  = pin,func  ; RX pin: function number
;   uart*_pin_cts = pin,func  ; CTS pin: function number
;   uart*_pin_rts = pin,func  ; RTS pin: function number
; ------------------------------------------------------------------------------
uart0_default=1                ; Enable UART0 default pin configuration
uart1_default=1                ; Enable UART1 default pin configuration

; ------------------------------ Custom Pins -----------------------------------
; uart1_pin_tx=18,1
; uart1_pin_rx=17,1
; uart1_pin_cts=29,2
; uart1_pin_rts=28,2

[i2c]
; ------------------------------------------------------------------------------
; I2C Pin Configuration
; Format:
;   i2c*_default = en           ; Enable default pins for this I2C (en=enable, dis=disable)
;   i2c*_pin_scl = pin,func   ; SCL pin: function number
;   i2c*_pin_sda = pin,func   ; SDA pin: function number
; ------------------------------------------------------------------------------
i2c0_default=1                 ; Enable I2C0 default pin configuration
i2c1_default=1                 ; Enable I2C1 default pin configuration

; ------------------------------ Custom Pins -----------------------------------
; i2c0_pin_scl=57,2
; i2c0_pin_sda=58,2

[spi]
; ------------------------------------------------------------------------------
; SPI Pin Configuration
; Format:
;   spi*_default = en           ; Enable default pins for this SPI (en=enable, dis=disable)
;   spi*_pin_sclk = pin,func  ; SCLK pin: function number (clock)
;   spi*_pin_ssn  = pin,func  ; SSN pin: function number (chip select)
;   spi*_pin_mosi = pin,func  ; MOSI pin: function number (output)
;   spi*_pin_miso = pin,func  ; MISO pin: function number (input)
; ------------------------------------------------------------------------------
spi0_default=1                 ; Enable SPI0 default pin configuration
spi1_default=1                 ; Enable SPI1 default pin configuration

; ------------------------------ Custom Pins -----------------------------------
; spi0_pin_sclk=86,1
; spi0_pin_ssn=83,1 
; spi0_pin_mosi=85,1
; spi0_pin_miso=84,1

[cspi]
; ------------------------------------------------------------------------------
; CSPI Pin Configuration
; Format:
;   cspi*_default = en          ; Enable default pins for this CSPI (en=enable, dis=disable)
;   cspi*_pin_mclk = pin,func ; MCLK pin: function number (master clock)
;   cspi*_pin_pclk = pin,func ; PCLK pin: function number (pixel clock)
;   cspi*_pin_cs   = pin,func ; CS pin: function number (chip select)
;   cspi*_pin_sdo0 = pin,func ; SDO0 pin: function number (data output 0)
;   cspi*_pin_sdo1 = pin,func ; SDO1 pin: function number (data output 1)
; ------------------------------------------------------------------------------
cspi0_default=1                ; Enable CSPI0 default pin configuration
cspi1_default=1                ; Enable CSPI1 default pin configuration

; ------------------------------ Custom Pins -----------------------------------
; cspi0_pin_mclk = {26, 1};
; cspi0_pin_pclk = {30, 1};
; cspi0_pin_cs = {31, 1};
; cspi0_pin_sdo0 = {32, 1};
; cspi0_pin_sdo1 = {33, 1};

[i2s]
; ------------------------------------------------------------------------------
; I2S Pin Configuration
; Format:
;   i2s*_default = en           ; Enable default pins for this I2S (en=enable, dis=disable)
;   i2s*_pin_mclk = pin,func  ; MCLK pin: function number (master clock)
;   i2s*_pin_bclk = pin,func  ; BCLK pin: function number (bit clock)
;   i2s*_pin_lrck = pin,func  ; LRCK pin: function number (left/right clock)
;   i2s*_pin_din  = pin,func  ; DIN pin: function number (data input)
;   i2s*_pin_dout = pin,func  ; DOUT pin: function number (data output)
; ------------------------------------------------------------------------------
i2s0_default=1                 ; Enable I2S0 default pin configuration
i2s1_default=1                 ; Enable I2S1 default pin configuration

; ------------------------------ Custom Pins -----------------------------------
; i2s0_pin_mclk = {26, 1};
; i2s0_pin_bclk = {30, 1};
; i2s0_pin_lrck = {31, 1};
; i2s0_pin_din = {32, 1};
; i2s0_pin_dout = {33, 1};