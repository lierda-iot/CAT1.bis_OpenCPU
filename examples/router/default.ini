[PaltConfig]
; ------------------------------------------------------------------------------
; When crash Dump, the action to take
; value:
;   0 -- dump full exception info to flash and EPAT tool then trapped in endless loop(while(1))
;   1 -- print necessary exception info then reset
;   2 -- dump full exception info to flash then reset
;   3 -- dump full exception info to flash and EPAT tool then reset
;   4 -- reset directly
; ------------------------------------------------------------------------------
faultAction=4

; ------------------------------------------------------------------------------
; unilog on/off flag
; value:
;   0 -- unilog is disabled
;   1 -- only sw log is enabled
;   2 -- All log is enabled
; ------------------------------------------------------------------------------
logControl=2

; ------------------------------------------------------------------------------
; unilog output port select
; value:
;   0 -- USB
;   1 -- UART
;   2 -- MIX(for future use UART/USB dynamic select)
; ------------------------------------------------------------------------------
logPortSel=0

; ------------------------------------------------------------------------------
; usb hw enum control
; value:
;   0 -- enable USB init and enum RNDIS
;   1 -- enable USB init but not enum RNDIS
;   2 -- disable USB init
; ------------------------------------------------------------------------------
usbCtrl=1

; ------------------------------------------------------------------------------
; usb network
; value:
;   0 -- RNDIS
;   1 -- ECM 
;   2 -- def RNDIS and Windows ? --> ECM
;   3 -- def ECM and Windows ? --> RNDIS
; ------------------------------------------------------------------------------
usbNet=0

; ------------------------------------------------------------------------------
; when usb pluged in, whether consider usb vote to enter sleep
; value: 0 -- disable |  1 -- enable
usbSlpMask=0

; ------------------------------------------------------------------------------
; USB VBUS MODE Enable,Disable Flag
; valid value:
;       0 -- usb vbus mode disable
;       1 -- usb vbus mode enable
usbVBUSModeEn=0

; ------------------------------------------------------------------------------
; USB VBUS MODE Wakup Pad Index
; valid value:
; 0,1,2,3,4,5 PAD IDX FOR USB VBUS WKUP PAD
usbVBUSWkupPad=1

[NetCfg]
; ------------------------------------------------------------------------------
; netcid:        usbNet bind cid num.                  value: 0 - 15 -- cid num
; AutoDial:     when cid active, usbNet auto connect. value: 0 - off | 1 - on
; NetDevCtlUrc: usbNet control urc enable.            value: 0 - off | 1 - on
; NatEnable:    enable network address translation.   value: 0 - off | 1 - on
; ------------------------------------------------------------------------------
netcid=0
AutoDial=0
NetDevCtlUrc=0
NatEnable=0

[Mics]
; ------------------------------------------------------------------------------
; cfun:     cfun mode.                      value: 0 - off | 1 - on
; bAutoApn: auto apn connect.               value: 0 - off | 1 - on
; dataCont: enable data usage statistics.   value: 0 - off | 1 - on
; pwrKeyMode: power key mode.            
;   value:  0 -- internal pull up, with debounce
;           1 -- internal pull up, without debounce
;           2 -- no pull, without debounce
; pwrkeyDelay: powerkey Debounce delayms.   value: 0 ~ 65535 | default: 50 
;   note: when pwrKeyMode == 0 Valided.
; ------------------------------------------------------------------------------
cfun=1
AutoApn=0
dataCont=0
pwrKeyMode=0
;pwrkeyDelay=50

; ------------------------------------------------------------------------------
; uart1At:  uart1 AT command enable.        value: 0 - off | 1 - on
; uart2At:  uart2 AT command enable.        value: 0 - off | 1 - on
; atEcho:   echo AT command enable.         value: 0 - off | 1 - on
; appLogPort: app output log port.          
;   value:  0 Output logs via USBAT.
;           1 Output logs via UART2, provided that uart2At=1 must be set.
;           3 Output logs via the system interface, which requires viewing with EPAT.
; uartbootloader: defult uart at bootloader. 
;    value: 600,1200,2400,4800,9600,19200,38400,57600,115200,230400,460800,921600,3000000
; ------------------------------------------------------------------------------
[AT]
uart1At=1
uart2At=0
atEcho=0
appLogPort=3
uartbootloader=115200

[APN]
; ------------------------------------------------------------------------------
; apn config
; 
; iptype: 1-IP_V4, 2-IP_V6, 3-IP_V4V6, 4-UNUSED, 5-NONIP
; apn: apn string, in fact MAX: 99 bytes
; userName: user name string, in fact MAX: 63 bytes
; pwd: password string, in fact MAX: 63 bytes
; ------------------------------------------------------------------------------
;apniptype=1
;apn="cmnet"
;userName="user"
;pwd="passwd"

[PS]
; ------------------------------------------------------------------------------
; ps config
;
; datacount:  Open traffic statistics.  value: 0 - off  | 1 - on
; simslot: choose simslot num.          value: 0 - sim0 | 1 - sim1
; ------------------------------------------------------------------------------
;datacount=0
;simslot=0

[EXTFLASH IMAGE]
; ------------------------------------------------------------------------------
; ext flash image config
;
; efImageEn: enable ext flash image pack into binpkg.  value: 0 - off | 1 - on
; efSpiPort: SPI port for ext flash burn.              value: 0 - SPI0 | 1 - SPI1
;   note: addrname prefix: SPI0 -> "EF_", SPI1 -> "EFID01_"
; efLfsLna:  ext flash LFS partition start address.    value: hex address
;   note: address must start from 0x80000000
; efLfsSize: ext flash LFS partition size.             value: hex size
;   note: size must be 4KB aligned (multiple of 0x1000)
; ------------------------------------------------------------------------------
efImageEn=0
efSpiPort=1
efLfsLna=0x80000000
efLfsSize=0x200000